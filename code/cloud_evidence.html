<!doctype html><html lang="en"><meta charset="utf-8"><title>Gursevak Singh 40210 AWS execution evidence</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#142c43;font:21px Arial}header{background:#132a43;color:white;padding:24px 42px;display:flex;justify-content:space-between;align-items:center}h1{font-size:34px;margin:6px 0}small{font-size:17px}nav{padding:17px 42px;background:white;border-bottom:1px solid #d6dfe6}select{font:20px Arial;padding:9px;width:430px;margin-right:22px}main{padding:25px 42px}h2{font-size:30px;margin:0 0 16px}h3{font-size:23px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.three{grid-template-columns:1fr 1fr 1fr}.card{background:white;border:1px solid #cedae4;border-radius:8px;padding:22px;min-width:0}pre{font:17px/1.4 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}table{border-collapse:collapse;width:100%;font-size:20px}td,th{border-bottom:1px solid #dce5eb;padding:11px;text-align:left}th{background:#eaf0f5}.image{width:100%;height:480px;object-fit:contain}.status{background:#dcefe8;color:#135b49;padding:9px 14px;border-radius:6px}footer{position:fixed;bottom:0;background:white;border-top:1px solid #d6dfe6;padding:16px 42px;width:100%;font-size:17px}.note{font-size:18px;line-height:1.45;color:#526477;margin:16px 0}.mono{font-family:Consolas;font-size:18px}a{color:#146c9d}</style>
<header><div><small>ITC5205 Assignment 2 · Recorded AWS SDK and HTTP evidence</small><h1>Image object identification on AWS</h1></div><div>Gursevak Singh · Student ID 40210<br><small>Region us-east-1 · Account identifier redacted</small></div></header>
<nav><select id="view" aria-label="Evidence view"></select><span class="status">Real cloud execution records</span> <small>Evidence viewer · not the AWS Management Console</small></nav>
<main id="content">Loading saved results…</main><footer id="source"></footer>
<script>
const files=['cloud-identity','cloud-service-configuration','cloud-function-configuration','cloud-http-tests','cloud-s3-objects','cloud-analysis','cloud-dynamodb-items','local-environment','package-build'];
const views=['Environment','IAM policy','S3 configuration','Lambda deployment','API integration','HTTP success','Failure cases','Bus output','Dog output','Zidane output','CloudWatch logs','Memory comparison','API cold starts','Concurrency','DynamoDB metadata'];
const $=id=>document.getElementById(id);let d={};
function esc(x){return String(x).replace(/\b\d{12}\b/g,'[ACCOUNT REDACTED]').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
const json=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
const compact=x=>'<pre>'+esc(JSON.stringify(x))+'</pre>';
const card=(title,body)=>'<section class="card"><h3>'+esc(title)+'</h3>'+body+'</section>';
const table=(heads,rows)=>'<table><thead><tr>'+heads.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
function show(){let i=+$('view').value,c=d['cloud-service-configuration'],a=d['cloud-analysis'],http=d['cloud-http-tests'],body='',source='';
if(i===0){body=card('Verified AWS identity',json(d['cloud-identity']))+card('Model and local dependencies',json(Object.fromEntries(Object.entries(d['local-environment']).filter(([k])=>k!=='cloud_deployment'))));source='cloud-identity.json and local-environment.json';}
if(i===1){body=card('Lambda execution policy',compact(c.execution_policy))+card('Trust and policy boundary',json({role:c.role.RoleName,trust:c.role.AssumeRolePolicyDocument,inline_policies:c.remaining_inline_policies})+'<p class="note">Dynamic output keys require output/*. The temporary write-denial policy was removed after testing. No administrator policy is attached to this execution role.</p>');source='cloud-service-configuration.json · exact deployed policy; only account IDs redacted';}
if(i===2){body=card('Private S3 controls',compact({public_access:c.s3_public_access.PublicAccessBlockConfiguration,encryption:c.s3_encryption.ServerSideEncryptionConfiguration,lifecycle:c.s3_lifecycle.Rules}))+card('Persisted S3 inputs and outputs',table(['Object key','Bytes'],d['cloud-s3-objects'].filter(x=>!x.Key.startsWith('deploy/')).map(x=>[x.Key,x.Size])));source='cloud-service-configuration.json and cloud-s3-objects.json';}
if(i===3){body=card('Deployed Lambda configuration',compact(d['cloud-function-configuration']))+card('Real package build and direct invocation',compact(d['package-build'])+'<br>'+compact({request_id:a.reports[0].request_id,duration_ms:a.reports[0].duration_ms,billed_ms:a.reports[0].billed_ms,max_memory_mb:a.reports[0].max_memory_mb,init_ms:a.reports[0].init_ms}));source='cloud-function-configuration.json, package-build.json and CloudWatch REPORT';}
if(i===4){body=card('HTTP API and route security',compact({name:c.api.Name,endpoint:c.api.ApiEndpoint,routes:c.routes}))+card('Lambda integration and stage',compact({integrations:c.integrations,stages:c.stages.map(s=>({StageName:s.StageName,AutoDeploy:s.AutoDeploy,DefaultRouteSettings:s.DefaultRouteSettings}))}));source='cloud-service-configuration.json · authenticated POST /detect';}
if(i===5){let r=http[0];body=card('Signed HTTP request',json({timestamp:r.timestamp,method:'POST',url:c.api.ApiEndpoint+'/detect',authorization:'AWS Signature Version 4',body:JSON.parse(r.request_body)})+'<p class="note">Authorization headers and credentials are deliberately not recorded.</p>')+card('Actual HTTP response',compact({http_status:r.http_status,latency_ms:r.latency_ms,...r.response}));source='cloud-http-tests.json · first signed bus request';}
if(i===6){body=card('Observed failure and recovery responses',table(['Case','HTTP','Message'],http.filter((r,n)=>[3,4,5,6,7,13,14].includes(n)).map((r,n)=>[['Unsigned request','Missing S3 object','Corrupt image','Unsupported extension','Malformed JSON','Temporary S3 write denial','Write permission restored'][n],r.http_status,r.response.error||r.response.message||r.response.status])))+card('S3 failure is explicit',json(http[13])+'<p class="note">The denial was scoped only to this project output prefix and removed in a finally block. The next request returned 200.</p>');source='cloud-http-tests.json · deliberate negative tests, not unexpected production incidents';}
if(i>=7&&i<=9){let n=['bus','dog','zidane'][i-7],r=http[i-7].response;body=card('Original '+n+' image','<img class="image" src="../images/inputs/'+n+'.jpg">')+card('Annotated image downloaded from S3','<img class="image" src="../images/outputs/cloud-'+n+'.jpg"><p class="mono">'+esc(r.output.image_key)+'</p>');source='images/outputs/cloud-'+n+'.jpg and .json · '+r.timestamp+' · '+r.detections.length+' detections';}
if(i===10){let logs=a.reports.filter((r,n)=>n===0||n===1||n===11||n===12||r.request_id===http[13].response.request_id);body=card('Actual Lambda REPORT lines','<pre>'+esc(logs.map(r=>r.raw).join('\n\n'))+'</pre>')+card('Observed runtime interpretation',table(['Field','Meaning'],[['Duration','AWS invocation duration in milliseconds'],['Billed Duration','Charged execution interval including eligible initialization'],['Memory Size','Configured allocation, not actual use'],['Max Memory Used','Runtime high-water measurement'],['Init Duration','Initialization evidence on that request']])+'<p class="note">Raw CloudWatch events are preserved with event IDs, timestamps and log stream names. Handled HTTP errors still return a valid Lambda response.</p>');source='cloudwatch-events.json · service-generated records';}
if(i===11){body=card('Controlled memory comparison',table(['Memory MB','Runs','Warm mean ms','Warm GB-s','Max used MB'],a.comparison.map(x=>[x.memory_mb,x.runs,x.mean_warm_duration_ms,x.mean_warm_gb_seconds,x.max_memory_mb])))+card('Measurement limits and costs',json({billed_gb_seconds:a.observed_billed_gb_seconds,lambda_estimate_USD:a.estimated_lambda_usd_before_free_allowances,scope:a.cost_scope})+'<p class="note">Three direct invocations per setting; first initialization excluded from each two-sample warm mean. This is a bounded demonstration, not a statistically conclusive benchmark.</p>');source='cloud-analysis.json derived from raw REPORT logs; source analysis code included';}
if(i===12){body=card('Two actual API requests after configuration update',table(['Sequence','HTTP','Client ms','AWS init ms'],a.cold_probe.map(x=>[x.sequence,x.http_status,x.latency_ms,x.report?.init_ms??'None in REPORT'])))+card('Correlated CloudWatch evidence','<pre>'+esc(a.cold_probe.map(x=>x.report?.raw||'REPORT unavailable').join('\n\n'))+'</pre><p class="note">Explicit environment configuration change before request 1. This tests a controlled initialization; it does not measure idle-time cold-start probability.</p>');source='cloud-api-cold-probe.json and request-ID matched cloudwatch-events.json';}
if(i===13){body=card('Two-worker bounded request batch',json(a.concurrency))+card('Actual request latency',table(['Input','HTTP','Client ms'],http.slice(11,13).map(x=>[x.key,x.http_status,x.latency_ms]))+'<p class="note">Batch elapsed time includes 0.7 s pacing. Overlapping client requests do not by themselves prove simultaneous Lambda invocations. Account concurrency quota is 10; reserved concurrency was rejected. API limit is 2 RPS with burst 2. No sustained load test or explicit autoscaling policy was created.</p>');source='cloud-concurrency.json and cloud-http-tests.json';}
if(i===14){body=card('Metadata table configuration',json({TableName:c.table.TableName,TableStatus:c.table.TableStatus,KeySchema:c.table.KeySchema,BillingModeSummary:c.table.BillingModeSummary,TTL:c.table_ttl,exported_records:d['cloud-dynamodb-items'].length}))+card('A genuine persisted metadata record',json(d['cloud-dynamodb-items'][0]));source='cloud-service-configuration.json and cloud-dynamodb-items.json';}
$('content').innerHTML='<h2>'+views[i]+'</h2><div class="grid">'+body+'</div>';$('source').textContent='Source: '+(source.startsWith('images/')?'':'test-results/')+source;}
Promise.all(files.map(async f=>{let r=await fetch('../test-results/'+f+'.json');if(!r.ok)throw Error(f);d[f]=await r.json();})).then(()=>{$('view').innerHTML=views.map((v,i)=>'<option value="'+i+'">'+v+'</option>').join('');$('view').onchange=show;show();}).catch(e=>{$('content').textContent='Evidence load failed: '+e;});
</script></html>
